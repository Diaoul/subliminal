        --> 01:55:14,105\n...\n\n1919\n01:55:14,139 --> 01:55:17,143\n...\n\n1920\n01:55:17,176
        --> 01:55:21,614\n...\n\n1921\n01:55:30,456 --> 01:55:31,990\nTu es en retard.\n\n1922\n01:55:32,024
        --> 01:55:33,400\nOn peut pas \xEAtre partout \xE0 la fois.\n\n1923\n01:55:33,425
        --> 01:55:35,226\nUn petit texto aurait suffi.\n\n1924\n01:55:35,260 --> 01:55:37,004\nJ'\xE9tais
        parti que deux heures.\nQu'est-ce qu'il s'est pass\xE9?\n\n1925\n01:55:37,029
        --> 01:55:39,065\nOkay.\nJe sais de quoi \xE7a a l'air.\n\n1926\n01:55:39,097
        --> 01:55:40,315\nMais voil\xE0 la bonne nouvelle.\n\n1927\n01:55:40,316 -->
        01:55:41,533\nEt c'est parti.\n\n1928\n01:55:41,567 --> 01:55:43,469\n<i>Le
        multivers ne s'est pas effondr\xE9.</i>\n\n1929\n01:55:43,502 --> 01:55:44,370\nOh,
        cool!\n\n1930\n01:55:44,371 --> 01:55:45,237\nUne retouche par ci, une autre
        par l\xE0.\n\n1931\n01:55:45,270 --> 01:55:46,739\nMais \xE7a a march\xE9.\n\n1932\n01:55:46,771
        --> 01:55:48,182\nPassionnant.\nT'as fini le bidule?\n\n1933\n01:55:48,207
        --> 01:55:49,608\nC'est pas un bidule.\nC'est un gadget.\n\n1934\n01:55:49,640
        --> 01:55:51,143\nT'es oblig\xE9 de toujours me reprendre?\n\n1935\n01:55:51,176
        --> 01:55:52,352\nC'est vraiment frustrant\net \xE7a me d\xE9prime.\n\n1936\n01:55:52,377
        --> 01:55:53,679\nT'excites pas, Miguel.\n\n1937\n01:55:53,712 --> 01:55:55,188\n-
        C'est qu'un prototype.\n- Je suis pas excit\xE9.\n\n1938\n01:55:55,213 -->
        01:55:56,456\nMais tu pourrais \xEAtre la premi\xE8re personne\n\n1939\n01:55:56,481
        --> 01:55:58,417\n\xC0 faire un saut multivers autonome.\n\n1940\n01:55:58,449
        --> 01:55:59,719\nOu la derni\xE8re.\n\n1941\n01:55:59,752 --> 01:56:01,554\nOn
        jette les d\xE8s c'est \xE7a?\n\n1942\n01:56:01,587 --> 01:56:04,423\nAlors
        qu'est-ce que t'en dit partenaire?\nO\xF9 veux-tu aller en premier?\n\n1943\n01:56:04,456
        --> 01:56:07,360\nRecommen\xE7ons du \nd\xE9but une derni\xE8re fois.\n\n1944\n01:56:07,393
        --> 01:56:09,595\nLa Terre, 1967.\n\n1945\n01:56:12,131 --> 01:56:12,899\nWhoa!\n\n1946\n01:56:12,900
        --> 01:56:13,666\nQu'est-ce que...?\n\n1947\n01:56:13,698 --> 01:56:15,300\nJe
        suis Spider-Man.\n\n1948\n01:56:15,333 --> 01:56:16,677\n- Tu dois venir avec
        moi.\n- Mais qui \xEAtes-vous?\n\n1949\n01:56:16,702 --> 01:56:19,204\nJe
        viens de te le dire...\n\xC9coute. Je viens du futur.\n\n1950\n01:56:19,238
        --> 01:56:20,213\nComment oses-tu me pointer du doigt!\n\n1951\n01:56:20,238
        --> 01:56:21,474\nTu me pointais en premier.\n\n1952\n01:56:21,506 --> 01:56:22,758\nC'est
        malpoli de pointer du doigt.\n\n1953\n01:56:22,759 --> 01:56:24,009\nTu es
        tr\xE8s malpoli.\n\n1954\n01:56:24,042 --> 01:56:26,045\nLequel a point\xE9
        en premier?\n\n1955\n01:56:26,078 --> 01:56:28,014\nSpider-Man voyons.\n\n1956\n01:56:28,046
        --> 01:56:29,722\n- Tu me pointes en ce moment m\xEAme.\n- Non je te pointe
        pas.\n\n1957\n01:56:29,747 --> 01:56:31,449\nRegarde ton doigt.\n\n1958\n01:56:31,483
        --> 01:56:32,759\nJe pointe ton pointage, nuance.\n\n1959\n01:56:32,784 -->
        01:56:34,386\nTu sais pas ce que\nc'est que le pointage.\n"
