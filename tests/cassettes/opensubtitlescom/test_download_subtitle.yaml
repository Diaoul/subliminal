      string: "1\n00:01:18,243 --> 00:01:20,379\n<i>Okay,\nr\xE9sumons encore une
        fois.</i>\n\n2\n00:01:20,412 --> 00:01:22,481\n<i>Je m'appelle Peter Parker.</i>\n\n3\n00:01:22,515
        --> 00:01:25,784\n<i>J'ai \xE9t\xE9 mordu \npar une araign\xE9e radioactive.</i>\n\n4\n00:01:25,817
        --> 00:01:27,587\n<i>Et pendant 10 ans...</i>\n\n5\n00:01:27,620 --> 00:01:28,820\n<i>J'\xE9tais
        le seul</i>\n\n6\n00:01:28,853 --> 00:01:30,555\n<i>et l'unique</i>\n\n7\n00:01:30,588
        --> 00:01:31,858\n<i>Spider-Man.</i>\n\n8\n00:01:31,891 --> 00:01:33,593\n<i>Je
        pense que vous connaissez la suite.</i>\n\n9\n00:01:33,626 --> 00:01:36,762\nUn
        grand pouvoir implique\nde grandes responsabilit\xE9s.\n\n10\n00:01:36,795
        --> 00:01:41,234\n<i>J'ai sauv\xE9 un tas de gens,\nje suis tomb\xE9 amoureux,
        j'ai sauv\xE9 la ville.</i>\n\n11\n00:01:42,534 --> 00:01:44,170\n<i>Et j'ai
        encore sauv\xE9 la ville.</i>\n\n12\n00:01:44,203 --> 00:01:45,304\n<i>Et
        encore, et encore</i>\n\n13\n00:01:45,337 --> 00:01:46,606\n<i>et encore.</i>\n\n14\n00:01:46,638
        --> 00:01:47,606\n<i>Et j'ai, euh...</i>\n\n15\n00:01:47,640 --> 00:01:49,207\n<i>J'ai
        fait \xE7a.</i>\n\n16\n00:01:49,240 --> 00:01:51,310\n...\n\n17\n00:01:51,343
        --> 00:01:52,677\n...\n\n18\n00:01:52,710 --> 00:01:55,147\n<i>Mais \xE7a
        on \xE9vite d'en parler.</i>\n\n19\n00:01:55,180 --> 00:01:57,349\n<i>J'ai
        un comic book.\nUne marque de c\xE9r\xE9ales aussi.</i>\n\n20\n00:01:57,382
        --> 00:01:58,617\n<i>J'ai m\xEAme enregistr\xE9 un album de No\xEBl.</i>\n\n21\n00:01:58,650
        --> 00:02:00,286\n<i>Ma chanson th\xE8me d\xE9chire d'ailleurs.</i>\n\n22\n00:02:00,319
        --> 00:02:02,355\n...\n\n23\n00:02:02,388 --> 00:02:04,590\n<i>J'ai aussi
        une glace d\xE9gueu.</i>\n\n24\n00:02:04,623 --> 00:02:07,293\n<i>Enfin, j'ai
        eu plus mauvaise mine.</i>\n\n25\n00:02:07,325 --> 00:02:09,662\n<i>Mais au
        final...</i>\n\n26\n00:02:09,694 --> 00:02:12,197\n<i>J'adore toujours \xEAtre
        Spider-Man.</i>\n\n27\n00:02:12,230 --> 00:02:13,566\n<i>Qui n'aimerait pas?</i>\n\n28\n00:02:13,598
        --> 00:02:15,667\n<i>Alors qu'importe le nombre\nde coups que je prends...</i>\n\n29\n00:02:17,802
        --> 00:02:21,640\n<i>...je trouve toujours un \nmoyen de me relever.</i>\n\n30\n00:02:21,674
        --> 00:02:25,478\n<i>Parce que la seule chose qui se \ndresse entre cette
        ville et le chaos</i>\n\n31\n00:02:25,510 --> 00:02:27,180\n<i>c'est moi.</i>\n\n32\n00:02:27,212
        --> 00:02:29,549\n<i>Il n'y a qu'un seul Spider-Man.</i>\n\n33\n00:02:30,949
        --> 00:02:32,817\n<i>Et il est juste devant vos yeux.</i>\n\n34\n00:02:33,018
        --> 00:02:35,018\nTraduction par Lilin\n\n35\n00:02:35,320 --> 00:02:36,354\n...\n\n36\n00:02:36,388
        --> 00:02:39,558\n...\n\n37\n00:02:43,262 --> 00:02:44,330\n...\n\n38\n00:02:47,532
        --> 00:02:49,467\n...\n\n39\n00:02:49,501 --> 00:02:51,403\n- Miles!\n\n40\n00:02:51,437
        --> 00:02:54,640\n<i>Miles, ch\xE9ri, c'est l'heure d'aller \xE0 l'\xE9cole!</i>\n\n41\n00:02:54,673
        --> 00:02:56,408\nMiles!\n\n42\n00:02:57,710 --> 00:02:59,512\nMiles!\n\n43\n00:02:59,544
        --> 00:03:00,562\nMiles!\n\n44\n00:03:00,563 --> 00:03:01,580\nOuais! Ouais?\n\n45\n00:03:01,614
        --> 00:03:03,915\nT'as fini de pr\xE9parer\ntes affaires?\n\n46\n00:03:03,949
        --> 00:03:05,318\nOuaaais.\n\n47\n00:03:06,551 --> 00:03:08,920\nJe repasse
        juste mon dernier t-shirt.\n\n48\n00:03:10,556 --> 00:03:12,258\n...\n\n49\n00:03:12,290
        --> 00:03:14,227\nAllons! T'es un adulte maintenant.\n\n50\n00:03:14,259 -->
        00:03:16,328\n- Alors montre-le \xE0 tes profs.\n- Miles!\n\n51\n00:03:16,361
        --> 00:03:18,597\nO\xF9 est mon pc?\n\n52\n00:03:18,631 --> 00:03:20,832\nSi
        tu veux que je te conduise,\non doit partir maintenant.\n\n53\n00:03:20,866
        --> 00:03:22,368\nNon, papa, je vais marcher.\n\n54\n00:03:22,401 --> 00:03:24,403\n-
        T'es s\xFBr ? Mon offre va bient\xF4t expirer.\n- \xC7a ira.\n\n55\n00:03:25,737
        --> 00:03:26,755\nMiles! Faut que t'y ailles.\n\n56\n00:03:26,756 --> 00:03:27,772\nDans
        une minute!\n\n57\n00:03:27,806 --> 00:03:28,741\nFaut que j'y aille.\n\n58\n00:03:28,742
        --> 00:03:29,675\nDans une minute!\n\n59\n00:03:29,707 --> 00:03:31,409\nMaman,
        faut que j'y aille.\n\n60\n00:03:31,443 --> 00:03:32,612\nDans une minute.\n\n61\n00:03:37,015
        --> 00:03:38,950\n\xC0 vendredi.\n\n62\n00:03:41,520 --> 00:03:43,789\nOh
        un revenant!\nYo, \xE7a va mec?\n\n63\n00:03:43,822 --> 00:03:46,859\nHey,
        je fais que passer. \n\xC7a roule?\n\n64\n00:03:48,560 --> 00:03:50,795\nYo,
        Miles! T'as senti\nle s\xE9isme hier soir?\n\n65\n00:03:50,829 --> 00:03:53,866\nDe
        quoi tu parles?\nJ'ai dormi comme un b\xE9b\xE9 hier soir.\n\n66\n00:03:53,899
        --> 00:03:54,834\nElle est comment cette nouvelle \xE9cole?\n\n67\n00:03:54,835
        --> 00:03:55,768\nPff, du g\xE2teau.\n\n68\n00:03:55,800 --> 00:03:57,419\nTu
        nous manques, Miles!\n\n69\n00:03:57,420 --> 00:03:59,037\nJe vous manque?
        \nMais j'habite toujours ici!\n\n70\n00:03:59,070 --> 00:04:01,274\nAttends,
        je te manque?\n\n71\n00:04:07,913 --> 00:04:09,515\n<i>Contra!</i>\n\n72\n00:04:10,816
        --> 00:04:13,019\nOh, c'est pas vrai.\n\n73\n00:04:14,620 --> 00:04:16,989\nS\xE9rieux,
        papa.\nJ'aurais tr\xE8s bien pu marcher.\n\n74\n00:04:17,021 --> 00:04:18,591\nT'auras
        tout le temps de marcher samedi\n\n75\n00:04:18,624 --> 00:04:19,866\nquand
        tu \nm'enl\xE8veras ces stickers.\n\n76\n00:04:19,891 --> 00:04:21,927\nT'as
        vu \xE7a?\nJe suis pas certain que ce soit les miens.\n\n77\n00:04:21,959
        --> 00:04:23,928\nEt les deux d'hier\nsur Clinton.\n\n78\n00:04:23,961 -->
        00:04:26,464\nOuais, \xE7a c'\xE9tait les miens.\n\n79\n00:04:26,497 --> 00:04:29,668\nRegarde
        \xE7a.\nEncore un nouveau caf\xE9.\n\n80\n00:04:29,701 --> 00:04:30,536\nT'as
        vu?\n\n81\n00:04:30,537 --> 00:04:31,370\nAh. Ouais.\n\n82\n00:04:31,403 -->
        00:04:32,355\nIl s'appelle comment celui-l\xE0?\n\n83\n00:04:32,356 --> 00:04:33,306\nFoam
        Party.\n\n84\n00:04:33,338 --> 00:04:36,041\n\"Foam Party\"? (Soir\xE9e Mousse)
        S\xE9rieux.\n\n85\n00:04:36,074 --> 00:04:38,411\nEt y a une queue pas possible
