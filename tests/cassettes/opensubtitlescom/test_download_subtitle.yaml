        --> 01:38:31,171\nLe vrai Spider-Man \nn'a m\xEAme pas pu me battre.\n\n1602\n01:38:33,573
        --> 01:38:35,276\nTu n'es rien!\n\n1603\n01:38:41,314 --> 01:38:43,550\nTu
        m'as enlev\xE9 ma famille.\n\n1604\n01:38:47,386 --> 01:38:51,491\nJe vais
        m'assurer que tu\nne revoies plus jamais la tienne.\n\n1605\n01:39:11,011
        --> 01:39:13,013\nRel\xE8ve-toi, Spider-Man.\n\n1606\n01:39:15,347 --> 01:39:17,984\nRel\xE8ve-toi!
        Allez!\n\n1607\n01:39:24,524 --> 01:39:28,061\nAllez. Allez. Allez.\n\n1608\n01:39:39,204
        --> 01:39:42,341\nJ'aurai toujours ma famille.\n\n1609\n01:39:42,375 --> 01:39:44,110\nT'as
        d\xE9j\xE0 entendu\nparler du toucher de l'\xE9paule?\n\n1610\n01:39:45,211
        --> 01:39:46,313\nQuoi?\n\n1611\n01:39:50,483 --> 01:39:51,618\nHey.\n\n1612\n01:40:01,226
        --> 01:40:05,431\nHey, Kingpin!\nAppuie sur le bouton vert pour moi!\n\n1613\n01:41:54,407
        --> 01:41:57,377\nMiles? Miles? Tu vas bien?\n\n1614\n01:41:57,409 --> 01:41:58,511\n<i>Oui,
        je vais bien.</i>\n\n1615\n01:41:59,479 --> 01:42:00,713\nTu es s\xFBrement
        occup\xE9...\n\n1616\n01:42:00,747 --> 01:42:02,749\n<i>Non! Je peux parler.</i>\n\n1617\n01:42:02,782
        --> 01:42:06,653\n<i>\xC9coute, si je suis pass\xE9\ntout \xE0 l'heure cest
        parce que...</i>\n\n1618\n01:42:07,886 --> 01:42:09,105\nTon oncle...\n\n1619\n01:42:09,106
        --> 01:42:10,323\nJe sais, papa.\n\n1620\n01:42:11,623 --> 01:42:13,159\nJe
        suis d\xE9sol\xE9.\n\n1621\n01:42:13,193 --> 01:42:15,228\nOuais.\n\n1622\n01:42:15,261
        --> 01:42:16,696\nTu sais qui l'a tu\xE9?\n\n1623\n01:42:16,729 --> 01:42:18,532\nJe
        croyais le savoir.\n\n1624\n01:42:18,564 --> 01:42:20,666\nMais j'avais tort.\n\n1625\n01:42:20,699
        --> 01:42:24,237\nMiles,\nce que je t'ai dit \xE0 la porte,\n\n1626\n01:42:24,270
        --> 01:42:25,639\nc'\xE9tait pas des paroles en l'air.\n\n1627\n01:42:27,539
        --> 01:42:29,676\nTu sais je me suis dit\n\n1628\n01:42:29,708 --> 01:42:32,378\nqu'on
        pourrait trouver un mur sympa,\n\n1629\n01:42:32,412 --> 01:42:35,515\npriv\xE9,
        par exemple\nau poste de police,\n\n1630\n01:42:35,547 --> 01:42:41,547\no\xF9
        tu pourrais\nlaisser parler ton art.\n\n1631\n01:42:41,753 --> 01:42:44,256\nJe
        suis vraiment mauvais.\n\n1632\n01:42:44,289 --> 01:42:47,394\nOkay, Miles.
        Miles? T'es l\xE0?\n\n1633\n01:42:47,426 --> 01:42:50,329\nOh, c'est pas vrai.
        C-Mobile!\n\n1634\n01:42:50,363 --> 01:42:51,798\nMonsieur l'agent.\n\n1635\n01:42:51,799
        --> 01:42:53,233\nSpider-Man!\n\n1636\n01:42:53,265 --> 01:42:55,534\n\xC9coutez,
        ce que vous\navez fait en bas c'\xE9tait...\n\n1637\n01:42:55,568 --> 01:42:57,270\nJe
        veux dire, je vous\nsuis reconnaiss...\n\n1638\n01:42:57,302 --> 01:42:59,506\nOkay!\n\n1639\n01:43:07,279
        --> 01:43:09,349\nJ'ai h\xE2te de \ntravailler avec vous.\n\n1640\n01:43:09,381
        --> 01:43:11,784\nMoi aussi. Enfin. J'imagine.\n\n1641\n01:43:11,818 --> 01:43:14,954\nJe
        n'approuve pas vos m\xE9thodes,\n\n1642\n01:43:14,988 --> 01:43:18,425\nmais
        on trouvera un terrain d'entente.\n\n1643\n01:43:18,457 --> 01:43:21,393\nMerci
        pour votre\nbravoure de ce soir.\n\n1644\n01:43:21,426 --> 01:43:22,628\nJe
        t'aime.\n\n1645\n01:43:22,662 --> 01:43:24,231\nEuh, quoi?\n\n1646\n01:43:24,264
        --> 01:43:25,364\nEt regardez derri\xE8re vous!\n\n1647\n01:43:37,277 -->
        01:43:38,545\nOkay. Cool. Ouais.\n\n1648\n01:43:38,578 --> 01:43:39,946\nMerci,\nSpider-Man.\n\n1649\n01:43:39,979
        --> 01:43:41,780\n<i>Spider-Man,\na su servicio. Merci.</i>\n\n1650\n01:43:41,814
        --> 01:43:43,416\nHey, mec. \xC7a roule,\np'tit gars?\n\n1651\n01:43:43,448
        --> 01:43:44,617\nUn nouveau Spider-Man.\n\n1652\n01:43:44,650 --> 01:43:45,892\nOuaip,
        je suis\nle nouveau Spider-Man.\n\n1653\n01:43:45,917 --> 01:43:47,453\nRegardez
        \xE7a.\n\n1654\n01:43:47,487 --> 01:43:48,788\nWhoa!\n\n1655\n01:43:48,820
        --> 01:43:51,457\nC'\xE9tait voulu.\n\n1656\n01:43:51,490 --> 01:43:54,527\n<i>Bon,
        r\xE9sumons\ntout une derni\xE8re fois, okay?</i>\n\n1657\n01:43:54,560 -->
        01:43:56,029\n<i>Mais vraiment cette fois.</i>\n\n1658\n01:43:56,061 --> 01:43:57,697\n<i>Je
        m'appelle Miles Morales.</i>\n\n1659\n01:43:57,729 --> 01:43:59,798\n<i>J'ai
        \xE9t\xE9 mordu par\nune araign\xE9e radioactive.</i>\n\n1660\n01:43:59,832
        --> 01:44:01,434\n<i>Et depuis genre deux jours,</i>\n\n1661\n01:44:01,466
        --> 01:44:03,435\n<i>je suis\nle seul et l'unique Spider-Man.</i>\n\n1662\n01:44:03,469
        --> 01:44:04,938\n<i>Vous connaissez la suite.</i>\n\n1663\n01:44:04,970 -->
        01:44:06,439\n<i>J'ai fini ma r\xE9daction.</i>\n\n1664\n01:44:07,472 -->
        01:44:09,576\n<i>J'ai sauv\xE9 un paquet de gens.</i>\n\n1665\n01:44:11,043
        --> 01:44:12,912\n<i>Je me suis fait percuter par un dr\xF4ne.</i>\n\n1666\n01:44:12,944
        --> 01:44:14,648\n<i>J'ai fait \xE7a avec mon p\xE8re.</i>\n\n1667\n01:44:15,981
        --> 01:44:18,252\n<i>J'ai rencontr\xE9 mon coloc. Enfin.</i>\n\n1668\n01:44:20,019
        --> 01:44:23,356\n<i>J'ai coll\xE9 un sticker\nl\xE0 o\xF9 mon p\xE8re ne
        le trouvera jamais.</i>\n\n1669\n01:44:23,389 --> 01:44:25,025\n<i>Et quand
        je me sens seul,</i>\n\n1670\n01:44:25,057 --> 01:44:27,728\n<i>et que j'ai
        l'impression\nque personne comprend ce que je vis,</i>\n\n1671\n01:44:29,362
        --> 01:44:31,331\n<i>je me rappelle de mes\namis qui eux comprennent.</i>\n\n1672\n01:44:37,869
        --> 01:44:40,506\n<i>J'aurais jamais pens\xE9\npouvoir faire tout \xE7a un
        jour.</i>\n\n1673\n01:44:40,539 --> 01:44:42,042\n<i>Mais je peux.</i>\n\n1674\n01:44:43,643
        --> 01:44:45,545\n<i>N'importe qui peut porter le masque.</i>\n\n1675\n01:44:46,878
        --> 01:44:49,048\n<i>Vous pourriez porter le masque.</i>\n\n1676\n01:44:50,817
        --> 01:44:53,987\n<i>Si vous ne le saviez pas,\nj'esp\xE8re que maintenant
        c'est le cas.</i>\n\n1677\n01:45:02,694 --> 01:45:03,796\n<i>Car je suis Spider-Man.</i>\n\n1678\n01:45:05,797
        --> 01:45:08,534\n<i>Et je ne suis pas le seul.</i>\n\n1679\n01:45:08,568
        --> 01:45:10,070\n<i>Loin de l\xE0.</i>\n\n1680\n01:45:10,103 --> 01:45:12,372\n...\n\n1681\n01:45:12,404
