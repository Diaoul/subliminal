        compl\xE8tement.\n\n378\n00:19:26,230 --> 00:19:27,865\nRetrouve l'araign\xE9e.\n\n379\n00:19:27,898
        --> 00:19:29,500\nTu verras.\n\n380\n00:19:44,281 --> 00:19:45,683\nC'est
        une araign\xE9e normale.\n\n381\n00:19:45,717 --> 00:19:50,889\nTotalement
        normale et chiante,\nrien d'extraordinaire.\n\n382\n00:19:59,864 --> 00:20:01,633\n<i>Je
        suis l\xE0.</i>\n\n383\n00:20:01,665 --> 00:20:03,935\n<i>Pourquoi \xE7a m'arrive?</i>\n\n384\n00:20:10,008
        --> 00:20:12,644\n<i>Minute! Je fais quoi l\xE0?</i>\n\n385\n00:20:18,615
        --> 00:20:19,750\n<i>L\xE0-bas.</i>\n\n386\n00:20:19,784 --> 00:20:20,919\n<i>Tu
        es comme moi.</i>\n\n387\n00:20:20,951 --> 00:20:22,753\n<i>Miles. attention.</i>\n\n388\n00:20:22,787
        --> 00:20:24,456\n<i>Je veux pas \xEAtre un h\xE9ros.</i>\n\n389\n00:20:24,489
        --> 00:20:25,557\n<i>Miles.</i>\n\n390\n00:20:27,625 --> 00:20:28,559\nWhoa!\n\n391\n00:20:31,929
        --> 00:20:34,699\nNorman, \xE9coute-moi.\n\n392\n00:20:34,731 --> 00:20:36,433\n<i>Spider-Man?</i>\n\n393\n00:20:36,467
        --> 00:20:39,371\nJe peux pas te laisser ouvrir\nun portail vers une autre
        dimension.\n\n394\n00:20:39,403 --> 00:20:41,506\nBrooklyn est pas faite pour
        \xE7a.\n\n395\n00:20:42,773 --> 00:20:44,608\nLa d\xE9cision ne me revient
        pas.\n\n396\n00:20:44,642 --> 00:20:46,344\n<i>C'est le Bouffon Vert?!</i>\n\n397\n00:20:46,376
        --> 00:20:47,878\nPourquoi tu n'abandonnes pas?!\n\n398\n00:20:47,912 -->
        00:20:50,815\nJ'imagine que je pr\xE9f\xE8re Brooklyn\nquand elle n'est pas
        engloutie par un trou noir.\n\n399\n00:20:50,847 --> 00:20:52,517\nJe crois
        que je vais filer.\n\n400\n00:20:52,549 --> 00:20:54,485\nStaten Island, peut-\xEAtre.\nPas
        Brooklyn.\n\n401\n00:20:59,757 --> 00:21:01,593\nNon! Non!\n\n402\n00:21:23,347
        --> 00:21:24,950\nWhoa!\n\n403\n00:21:26,483 --> 00:21:28,319\nEt maintenant?\n\n404\n00:21:28,353
        --> 00:21:29,788\nC'est quoi cet endroit?\n\n405\n00:21:56,513 --> 00:21:58,616\nTu
        sais que tes\nlacets sont d\xE9faits?\n\n406\n00:21:59,717 --> 00:22:00,719\nHin-hin.\n\n407\n00:22:00,720
        --> 00:22:01,720\nC'est une combi,\n\n408\n00:22:01,752 --> 00:22:03,688\nalors
        j'ai pas ce probl\xE8me.\n\n409\n00:22:09,594 --> 00:22:12,697\nJe croyais
        \xEAtre le seul.\nTu es comme moi.\n\n410\n00:22:12,730 --> 00:22:14,132\nJ'en
        ai pas envie.\n\n411\n00:22:14,164 --> 00:22:17,034\nJe crois pas que \ntu
        aies le choix, petit.\n\n412\n00:22:17,067 --> 00:22:19,604\nJe suis s\xFBr
        que tu dois \navoir un paquet de questions.\n\n413\n00:22:19,636 --> 00:22:20,904\nOuais.\n\n414\n00:22:20,938
        --> 00:22:23,441\n\xC7a va aller.\nJe peux t'aider.\n\n415\n00:22:23,473 -->
        00:22:25,809\nSi tu restes dans le coin,\nje pourrai te montrer les ficelles.\n\n416\n00:22:25,843
        --> 00:22:28,146\nOuais.\n\n417\n00:22:28,179 --> 00:22:31,483\nJe dois juste
        d\xE9truire\ncette grosse machine\n\n418\n00:22:31,516 --> 00:22:33,551\navant
        que le continuum\nespace-temps s'effondre.\n\n419\n00:22:33,584 --> 00:22:34,553\nBouge
        pas.\n\n420\n00:22:37,587 --> 00:22:39,124\n\xC0 tout de suite.\n\n421\n00:22:49,834
        --> 00:22:51,536\n<i>Comment il fait \xE7a?</i>\n\n422\n00:22:53,871 --> 00:22:57,041\nC'est
        ici?\nNon, non, c'est l\xE0.\n\n423\n00:22:57,074 --> 00:22:59,477\nOkay,
        on s'y met.\n\n424\n00:22:59,509 --> 00:23:00,644\nJe me trompe toujours de
        sens.\n\n425\n00:23:02,113 --> 00:23:03,048\nOh, zut.\n\n426\n00:23:04,080
        --> 00:23:05,015\nProwler.\n\n427\n00:23:06,851 --> 00:23:08,920\nMec, j'\xE9tais
        un \npeu occup\xE9 l\xE0.\n\n428\n00:23:13,958 --> 00:23:15,093\nJe suis trop
        fatigu\xE9.\n\n429\n00:23:18,729 --> 00:23:20,966\nTu m'en veux?\nOn dirait
        que tu m'en veux.\n\n430\n00:23:27,939 --> 00:23:29,641\nC'est tout ce que
        t'as?\n\n431\n00:23:31,875 --> 00:23:33,711\nAw, d\xE9go\xFBtant.\n\n432\n00:23:33,743
        --> 00:23:36,847\n<i>Je devrais aller \nl\xE0-bas et l'aider.</i>\n\n433\n00:23:36,881
        --> 00:23:39,617\n<i>Qu'est-ce que je raconte?\nJe devrais pas faire \xE7a.</i>\n\n434\n00:23:45,155
        --> 00:23:49,092\nAttention. \nL'Homme-Araign\xE9e est l\xE0.\n\n435\n00:23:49,125
        --> 00:23:51,095\nTu aimes mon nouveau jouet?\n\n436\n00:23:51,127 --> 00:23:55,532\nIl
        m'a co\xFBt\xE9 une fortune, \nmais on ne vit qu'une fois, pas vrai?\n\n437\n00:23:55,566
        --> 00:23:58,803\nTu as fait tout ce chemin.\nRegarde au moins le test.\n\n438\n00:23:58,836
        --> 00:24:00,245\nC'est un sacr\xE9\nspectacle.\n\n439\n00:24:00,270 --> 00:24:01,205\nTu
        vas adorer.\n\n440\n00:24:04,976 --> 00:24:08,079\nNon! Non,\nne fais pas
        \xE7a! Arr\xEAte!\n\n441\n00:24:08,112 --> 00:24:11,548\nTu n'as pas conscience
        de ce qu'il peut faire!\nTu vas tous nous tuer!\n\n442\n00:24:26,163 --> 00:24:29,067\nJe
        vois de multiples\ndimensions s'ouvrir!\n\n443\n00:24:29,099 --> 00:24:34,038\nTrois,
        quatre, cinq\ndimensions s\xE9par\xE9es.\n\n444\n00:24:34,070 --> 00:24:36,073\nC'est
        instable! Nous devrions arr\xEAter.\n\n445\n00:24:48,786 --> 00:24:51,056\nNorm,
        tu penses quoi\ndes traumas cr\xE2niens?\n\n446\n00:24:54,858 --> 00:24:56,894\nJ'ai
        essay\xE9 de te pr\xE9venir.\n\n447\n00:25:10,074 --> 00:25:12,744\nBouffon,
        non!\nSors-le de l\xE0!\n\n448\n00:25:19,016 --> 00:25:20,852\n<i>Wilson!
        O\xF9 sommes-nous?</i>\n\n449\n00:25:22,752 --> 00:25:24,588\n<i>Tr\xE8s \xE9trange.</i>\n\n450\n00:25:24,622
        --> 00:25:25,990\n<i>Wilson!</i>\n\n451\n00:25:59,356 --> 00:26:01,960\nHey!
        \xC7a va aller?\n\n452\n00:26:01,992 --> 00:26:04,028\n\xC7a va, je vais bien.\nJe
        me repose juste un peu.\n\n453\n00:26:05,762 --> 00:26:06,713\nTu peux pas
        te lever?\n\n454\n00:26:06,714 --> 00:26:07,664\nOuais.\n\n455\n00:26:07,698
        --> 00:26:09,867\nOuais, je me rel\xE8ve toujours.\n\n456\n00:26:11,368 -->
        00:26:13,704\nLa toux\nn'est probablement pas bon signe.\n\n457\n00:26:13,738
        --> 00:26:15,740\nTrouvez-le. Maintenant.\n\n458\n00:26:15,772 --> 00:26:19,042\n\xC9coute,
        on va devoir faire \xE9quipe.\nOn a pas beaucoup de temps.\n\n459\n00:26:19,076
        --> 00:26:21,913\nCette cl\xE9 de contournement\nest le seul moyen d'arr\xEAter
        le collisionneur.\n\n460\n00:26:21,945 --> 00:26:25,616\nFaufile toi en haut,
        utilise la cl\xE9,\nappuie sur le bouton et fais tout p\xE9ter.\n\n461\n00:26:25,650
        --> 00:26:26,951\nTu dois cacher ton visage.\n\n462\n00:26:26,983 --> 00:26:29,186\nNe
        dis \xE0 personne qui tu es.\n\n463\n00:26:29,220 --> 00:26:32,256\nPersonne
        ne doit savoir. \nIl a tout le monde dans sa poche.\n\n464\n00:26:32,288 -->
        00:26:34,125\nS'il rallume la machine,\n\n465\n00:26:34,157 --> 00:26:36,059\ntout
        ce que tu connais dispara\xEEtra.\n\n466\n00:26:36,093 --> 00:26:37,996\nTa
        famille, tout le monde.\n\n467\n00:26:38,028 --> 00:26:40,397\nTout le monde.\n\n468\n00:26:40,431
        --> 00:26:42,834\nPromets-moi que tu le feras.\n\n469\n00:26:47,203 --> 00:26:48,673\nJe
        le promets.\n\n470\n00:26:48,705 --> 00:26:51,642\nVas-y. D\xE9truis le collisionneur.\n\n471\n00:26:51,675
        --> 00:26:53,110\nJe te retrouverai.\n\n472\n00:26:54,878 --> 00:26:56,046\n\xC7a
        va aller.\n\n473\n00:27:04,855 --> 00:27:05,823\nTombstone.\n\n474\n00:27:05,855
        --> 00:27:07,057\nLes tests sont termin\xE9s.\n\n475\n00:27:08,826 --> 00:27:11,996\nFaites
        remarcher cette machine.\nAu plus vite.\n\n476\n00:27:12,028 --> 00:27:13,964\nCours
        plus vite!\n\n477\n00:27:13,998 --> 00:27:15,700\nCes gars sont faibles.\n\n478\n00:27:15,732
        --> 00:27:18,435\nJ'aimerais pouvoir dire que je suis\nenchant\xE9 de te revoir,
        Spider-Man,\n\n479\n00:27:18,469 --> 00:27:19,804\nmais ce n'est pas le cas.\n\n480\n00:27:19,836
        --> 00:27:21,305\nHey, Kingpin.\nComment vont les affaires?\n\n481\n00:27:21,337
        --> 00:27:22,906\nElles explosent.\n\n482\n00:27:22,940 --> 00:27:26,244\nG\xE9nial.
        Aw, \xE7a c'est pas cool.\n\n483\n00:27:26,277 --> 00:27:28,846\n\xC7a pourrait
        ouvrir un trou \nnoir en dessous de Brooklyn.\n\n484\n00:27:28,878 --> 00:27:31,281\n\xC7a
        peut pas en valoir la peine.\n\n485\n00:27:31,315 --> 00:27:34,152\nCe n'est
        pas toujours\nune question d'argent, Spider-Man.\n\n486\n00:27:39,824 -->
        00:27:41,959\nTu ne veux pas savoir ce que j'ai vu l\xE0-dedans?\n\n487\n00:27:41,991
        --> 00:27:43,060\nAttends.\n\n488\n00:27:44,394 --> 00:27:47,264\nJe sais
        ce que tu essayes de faire,\n\n489\n00:27:47,298 --> 00:27:49,067\nmais \xE7a
        ne marchera pas.\n\n490\n00:27:49,099 --> 00:27:50,201\nIls sont morts.\n\n491\n00:28:04,248
        --> 00:28:05,750\nD\xE9barrassez-vous du corps.\n\n492\n00:28:05,782 --> 00:28:08,351\nC'\xE9tait
        quoi \xE7a?\n\n493\n00:28:11,221 --> 00:28:12,323\nTue-le.\n\n494\n00:28:47,023
        --> 00:28:49,426\nArr\xEAte de coller!\n\n495\n00:29:07,577 --> 00:29:10,981\n<i>Veuillez
        vous \xE9loigner de la bordure\ndu quai lors de la fermeture des portes.</i>\n\n496\n00:29:36,073
        --> 00:29:37,876\nJe crois que c'est un Banksy.\n\n497\n00:29:47,183 --> 00:29:49,119\nPolice!
        Les mains en l'air!\n\n498\n00:29:49,153 --> 00:29:50,889\nMiles? Miles!\n\n499\n00:29:52,288
        --> 00:29:53,590\nPourquoi tu n'es pas \xE0 l'\xE9cole?\n\n500\n00:29:53,624
        --> 00:29:56,928\nWhoa, whoa, whoa.\n\xC7a va. \xC7a va.\n\n501\n00:29:56,961
        --> 00:29:59,197\n<i>Miles?\nQu\xE9 te pasa?</i>\n\n502\n00:30:01,932 -->
        00:30:03,300\nC'est le tremblement de terre?\n\n503\n00:30:05,035 --> 00:30:06,571\nJe
        peux dormir ici cette nuit?\n\n504\n00:30:06,604 --> 00:30:08,239\nMiles.\nOn
        est en semaine.\n\n505\n00:30:08,271 --> 00:30:10,173\nTu t'es engag\xE9 aupr\xE8s
        de cette \xE9cole.\n\n506\n00:30:10,207 --> 00:30:11,810\nJeff, il va pas
        bien.\n\n507\n00:30:13,509 --> 00:30:16,213\nBien s\xFBr que tu peux rester.\n\n508\n00:30:17,580
        --> 00:30:18,281\nPapa?\n\n509\n00:30:18,282 --> 00:30:18,982\nOui.\n\n510\n00:30:20,284
        --> 00:30:23,153\nTu d\xE9testes vraiment Spider-Man?\n\n511\n00:30:25,189
        --> 00:30:27,959\nOuais, je veux dire, \navec les justiciers c'est toujours...\n\n512\n00:30:27,991
        --> 00:30:29,259\n<i>Jeff, mi amor.</i>\n\n513\n00:30:29,292 --> 00:30:31,228\nQuoi?
        Il m'a demand\xE9.\n\n514\n00:30:31,261 --> 00:30:33,897\nB\xE9b\xE9, tu sais
        ce que je pense de Spider-Man.\n\n515\n00:30:36,299 --> 00:30:38,001\n<i>Tu
        sabes que el te quiere mucho.</i>\n\n516\n00:30:38,035 --> 00:30:40,938\nC'est
        pour \xE7a qu'il est un peu dur avec toi, tu le sais hein?\n\n517\n00:30:40,971
        --> 00:30:45,308\nMaman, t'as d\xE9j\xE0 pens\xE9 \xE0 d\xE9m\xE9nager de
        Brooklyn?\n\n518\n00:30:45,342 --> 00:30:49,013\nNotre famille ne fuit jamais,
        Miles.\n\n519\n00:30:49,046 --> 00:30:51,182\nOuais, je sais.\n\n520\n00:30:54,151
        --> 00:30:55,486\nC'\xE9tait quoi \xE7a?\n\n521\n00:30:55,519 --> 00:30:57,255\nIl
        va mal, Jeff.\n\n522\n00:30:57,288 --> 00:30:58,588\nC'est justement dans
        ces moments\n\n523\n00:30:58,622 --> 00:31:00,391\nqu'il doit s'accrocher.\n\n524\n00:31:06,931
        --> 00:31:10,101\n<i>Nous interrompons ce\nprogramme pour un flash sp\xE9cial.</i>\n\n525\n00:31:10,134
        --> 00:31:11,434\n<i>Triste nouvelle ce soir.</i>\n\n526\n00:31:11,468 -->
        00:31:15,339\n<i>Le h\xE9ros Spider-Man \nest mort</i>\n\n527\n00:31:15,372
        --> 00:31:18,075\n<i>suite \xE0 des blessures\nsubies lors du dernier s\xE9isme</i>\n\n528\n00:31:18,107
        --> 00:31:20,912\n<i>ayant touch\xE9 Brooklyn.\nDe nombreuses sources confirment</i>\n\n529\n00:31:20,944
        --> 00:31:23,280\n<i>que c'est un d\xE9nomm\xE9 Peter Parker,\n\xE9tudiant
        de 26 ans</i>\n\n530\n00:31:23,314 --> 00:31:25,016\n<i>et photographe \xE0
        mi-temps,</i>\n\n531\n00:31:25,048 --> 00:31:29,452\n<i>qui se cachait sous
        le masque\nde Spider-Man pendant pr\xE8s de dix ans.</i>\n\n532\n00:31:29,486
        --> 00:31:32,456\n...\n\n533\n00:31:32,489 --> 00:31:34,625\n...\n\n534\n00:31:34,657
        --> 00:31:38,596\n...\n\n535\n00:31:38,628 --> 00:31:41,432\n<i>Il laisse
        derri\xE8re lui\nsa femme, Mary Jane,</i>\n\n536\n00:31:41,464 --> 00:31:43,268\n<i>ainsi
        que sa tante, May Parker.</i>\n\n537\n00:31:44,434 --> 00:31:47,203\n<i>Notre
        h\xE9ros, Spider-Man, n'est plus.</i>\n\n538\n00:31:47,237 --> 00:31:48,639\n...\n\n539\n00:31:48,672
        --> 00:31:51,275\n<i>Mon mari, Peter Parker,</i>\n\n540\n00:31:51,307 -->
        00:31:54,077\n<i>\xE9tait quelqu'un d'ordinaire.</i>\n\n541\n00:31:54,111
        --> 00:31:57,480\n<i>Il disait toujours que n'importe\nqui aurait pu rev\xEAtir
        le masque.</i>\n\n542\n00:31:57,513 --> 00:32:01,384\n<i>C'est juste \nlui
        qui a \xE9t\xE9 mordu.</i>\n\n543\n00:32:01,417 --> 00:32:03,721\nIl va me
        manquer.\n\n544\n00:32:03,753 --> 00:32:05,188\nOuais.\n\n545\n00:32:05,221
        --> 00:32:07,258\nOn \xE9tait amis, tu sais.\n\n546\n00:32:07,290 --> 00:32:09,159\nJe
        peux le ramener\ns'il me va pas ?\n\n547\n00:32:09,192 --> 00:32:11,494\n\xC7a
        finit toujours\n\n548\n00:32:11,528 --> 00:32:13,431\npar aller.\n\n549\n00:32:19,502
        --> 00:32:21,505\n<i>Il n'a pas voulu ces pouvoirs,</i>\n\n550\n00:32:24,607
        --> 00:32:28,144\n<i>mais il a choisi d'\xEAtre Spider-Man.</i>\n\n551\n00:32:28,178
        --> 00:32:30,748\n<i>Ce que j'aimais le plus chez Peter</i>\n\n552\n00:32:30,780
        --> 00:32:34,551\n<i>c'est qu'il nous faisait\ntous nous sentir plus forts.</i>\n\n553\n00:32:34,585
        --> 00:32:38,556\n<i>Nous avons tous\ndes pouvoirs en nous.</i>\n\n554\n00:32:38,588
        --> 00:32:41,291\n...\n\n555\n00:32:41,325 --> 00:32:43,193\nMais \xE0 notre
        mani\xE8re.\n\n556\n00:32:43,227 --> 00:32:45,196\nNous sommes tous Spider-Man.\n\n557\n00:32:45,229
        --> 00:32:48,766\n<i>Et nous comptons tous sur vous.</i>\n\n558\n00:32:48,798
        --> 00:32:50,634\nIls comptent sur moi.\n\n559\n00:32:50,666 --> 00:32:54,371\nPas
        toi sp\xE9cialement.\nC'est juste une m\xE9taphore.\n\n560\n00:34:45,481 -->
        00:34:48,152\nJe suis d\xE9sol\xE9, Mr. Parker.\n\n561\n00:34:48,184 --> 00:34:51,721\nCette
        cl\xE9 que vous m'avez donn\xE9,\n\n562\n00:34:51,755 --> 00:34:54,724\nje
        crois bien que je l'ai cass\xE9.\n\n563\n00:34:56,326 --> 00:34:58,528\nJe
        veux faire ce que vous m'avez demand\xE9.\n\n564\n00:34:58,561 --> 00:35:00,330\nVraiment.\n\n565\n00:35:00,364
        --> 00:35:03,400\nMais je suis d\xE9sol\xE9.\n\n566\n00:35:03,432 --> 00:35:06,670\nJe
        pense pas en \xEAtre capable.\n\n567\n00:35:06,702 --> 00:35:09,606\nJ'peux
        pas faire \xE7a sans vous.\n\n568\n00:35:09,639 --> 00:35:11,174\nHey, petit.\n\n569\n00:35:13,677
        --> 00:35:14,778\nWhoa!\n\n570\n00:35:17,648 --> 00:35:19,182\nQu'est-ce que
        je lui ai fait?!\n\n571\n00:35:30,661 --> 00:35:31,596\nNon.\n\n572\n00:35:36,233
        --> 00:35:37,735\n<i>Qui \xEAtes-vous?</i>\n\n573\n00:35:39,835 --> 00:35:42,873\n<i>Okay,\nr\xE9sumons
        encore une fois.</i>\n\n574\n00:35:44,641 --> 00:35:47,378\n<i>Je m'appelle
        Peter B. Parker.</i>\n\n575\n00:35:47,411 --> 00:35:50,581\n<i>J'ai \xE9t\xE9
        mordu\npar une araign\xE9e radioactive.</i>\n\n576\n00:35:50,614 --> 00:35:52,816\n<i>Et
        durant ces 22 derni\xE8res ann\xE9es,</i>\n\n577\n00:35:52,849 --> 00:35:56,586\n<i>je
        pensais \xEAtre le seul\net l'unique Spider-Man.</i>\n\n578\n00:35:57,788
        --> 00:35:59,389\nQuelle journ\xE9e.\n\n579\n00:35:59,422 --> 00:36:01,724\n<i>Je
        pense que\nvous connaissez la suite.</i>\n\n580\n00:36:01,757 --> 00:36:04,627\n<i>J'ai
