min_version = "4"
env_list = [
    "pre-commit",
    "mypy",
    { product = [["3.10", "3.14"], ["tests"]] },
    "coverage",
    "docs",
    "changelog",
]

[env_run_base]
package = "wheel"
wheel_build_env = ".pkg"
dependency_groups = ["tests"]
pass_env = ["COVERAGE_FILE"]
allowlist_externals = ["echo", "false"]
# This and the next few testenvs are a workaround for
# https://github.com/tox-dev/tox/issues/2858.
commands = [["echo", "Unrecognized environment name {envname}"], ["false"]]

[env.".pkg"]
pass_env = ["SETUPTOOLS_SCM_PRETEND_VERSION"]

[env.prepare-tests]
description = "download data for tests"
base_python = ["3"]
use_develop = true
pass_env = ["*"]
deps = ["requests"]
commands = [["python", "scripts/prepare_tests.py", { replace = "posargs", extend = true }]]

[env.tests]
commands = [["pytest", { replace = "posargs", default = ["-n", "auto"], extend = true }]]

[env_base.tests]
factors = [{ py_version = { prefix = "3.", start = 10, stop = 14 } }]
commands = [{ replace = "ref", of = ["env", "tests", "commands"], extend = false }]

[env.mypy]
dependency_groups = ["types", "tests"]
commands = [["mypy", "--install-types", "--non-interactive", { replace = "posargs", default = ["src", "tests", "scripts"], extend = true }]]

[env.coverage]
use_develop = true
deps = ["coverage[toml]>=7"]
commands = [
    ["python", "-m", "pytest", "--cov=subliminal", "--cov-report=", "--cov-fail-under=0", { replace = "posargs", default = ["-n", "auto"], extend = true }],
    ["coverage", "report", "--skip-covered", "--show-missing", "--fail-under=80"],
]
set_env.COVERAGE_PROCESS_START = "pyproject.toml"

[env_base.coverage]
factors = [{ py_version = { prefix = "3.", start = 10, stop = 14 } }]
commands = [{ replace = "ref", of = ["env", "coverage", "commands"], extend = false }]

[env.coverage-core]
use_develop = true
deps = ["coverage[toml]>=7"]
commands = [
    ["python", "-m", "pytest", "-m", "core", "--cov=subliminal", "--cov-report=", "--cov-fail-under=0", { replace = "posargs", default = ["-n", "auto"], extend = true }],
    ["coverage", "report", "--omit=src/subliminal/__main__.py,", "src/subliminal/converters/*,src/subliminal/providers/*,src/subliminal/refiners/*", "--skip-covered", "--show-missing", "--fail-under=100"],
]
set_env.COVERAGE_PROCESS_START = "pyproject.toml"

[env_base.coverage-base]
factors = [{ py_version = { prefix = "3.", start = 10, stop = 14 } }]
commands = [{ replace = "ref", of = ["env", "coverage-base", "commands"], extend = false }]

[env.pre-commit]
description = "run pre-commit-defined linters under `{base_python}`"
skip_install = true
base_python = ["3"]
deps = ["pre-commit>=2.9.3"]
commands = [["pre-commit", "run", "--all-files", "--show-diff-on-failure", { replace = "posargs", extend = true }]]
set_env.PYTHONWARNDEFAULTENCODING = ""

[env.docs]
base_python = ["3"]
dependency_groups = ["docs"]
allowlist_externals = ["sphinx-build"]
commands = [
    ["sphinx-build", "-n", "-T", "-W", "--keep-going", "-b", "html", "-d", "{envtmpdir}/doctrees", "docs", "docs/_build/html"],
    ["sphinx-build", "-n", "-T", "-W", "--keep-going", "-b", "linkcheck", "-d", "{envtmpdir}/doctrees", "docs", "docs/_build/html"],
    ["sphinx-build", "-n", "-T", "-W", "--keep-going", "-b", "doctest", "-d", "{envtmpdir}/doctrees", "docs", "docs/_build/html"],
]

[env.changelog]
dependency_groups = ["docs"]
allowlist_externals = ["towncrier"]
commands = [["towncrier", "build", { replace = "posargs", default = ["--version", "main", "--draft"], extend = true }]]

[env.release]
description = "do a release, required posarg of the version number"
base_python = ["3"]
dependency_groups = ["docs"]
use_develop = true
pass_env = ["*"]
deps = ["colorama", "tox"]
commands = [["python", "scripts/release.py", "{posargs}"]]

[env.prepare-release-pr]
description = "prepare a release PR from a manual trigger in GitHub actions"
use_develop = { replace = "ref", of = ["env", "release", "use_develop"], extend = true }
pass_env = { replace = "ref", of = ["env", "release", "pass_env"], extend = true }
deps = { replace = "ref", of = ["env", "release", "deps"], extend = true }
commands = [["python", "scripts/prepare-release-pr.py", "{posargs}"]]
