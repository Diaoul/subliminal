name: Publish Github release

on:
  push:
    tags:
      - "*.*.*"
  workflow_call:
    inputs:
      tag-name:
        description: 'Tag name'
        required: true
        type: 'string'
  workflow_dispatch:
    inputs:
      tag-name:
        description: 'Tag name'
        required: true
        type: 'string'

permissions: {}

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_PYTHON_VERSION_WARNING: "1"

jobs:
  # Always build & lint package.
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          persist-credentials: false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: |
          github.event_name == 'workflow_dispatch'
          || github.event_name == 'workflow_call'
        with:
          ref: ${{ inputs.tag-name }}
          persist-credentials: false
      - name: Build dist
        uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1
        id: baipp
    outputs:
      tag: ${{ steps.baipp.outputs.package_version }}


  github-release:
    name: Make a GitHub Release
    needs: [build-package]
    if: github.repository == 'Diaoul/subliminal'
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: mandatory for making GitHub Releases
      contents: write
      id-token: write

    # Publish a Github release when a tag was pushed, or it's called with a tag.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          ref: ${{ needs.build-package.outputs.tag }}
          persist-credentials: false

      - name: Download packages built by build-and-inspect-python-package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
