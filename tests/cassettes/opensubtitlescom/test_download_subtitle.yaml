        --> 00:04:41,079\nC'est un caf\xE9\nou une discoth\xE8que?\n\n88\n00:04:41,112
        --> 00:04:42,781\nPapa, t'es trop vieux.\n\n89\n00:04:42,814 --> 00:04:44,582\n<i>Nous
        avons re\xE7u de nombreux rapports</i>\n\n90\n00:04:44,615 --> 00:04:46,485\n<i>d'un
        myst\xE9rieux \xE9pisode \nsismique la nuit derni\xE8re.</i>\n\n91\n00:04:46,517
        --> 00:04:48,462\n<i>Des sources proches de \nSpider-Man disent qu'il s'occupe
        du probl\xE8me.</i>\n\n92\n00:04:48,487 --> 00:04:51,924\nSpider-Man. Je veux
        dire,\nce mec d\xE9barque toujours de nulle part,\n\n93\n00:04:51,956 -->
        00:04:54,360\nnous fait du zip-zip avec son petit masque\net ne rends de compte
        \xE0 personne. Pas vrai?\n\n94\n00:04:54,392 --> 00:04:55,527\nOuais, papa.
        Ouais.\n\n95\n00:04:55,560 --> 00:04:57,028\nPendant ce temps-l\xE0,\nmes
        gars sont sur le terrain,\n\n96\n00:04:57,062 --> 00:04:58,264\nmettent leurs
        vies en jeu, sans masque.\n\n97\n00:04:58,265 --> 00:04:59,465\nHin-hin.\n\n98\n00:04:59,497
        --> 00:05:00,966\nOn montre nos visages.\n\n99\n00:05:00,967 --> 00:05:02,435\nAcc\xE9l\xE8re.
        Je connais ces gamins.\n\n100\n00:05:02,468 --> 00:05:04,437\nUne grande aptitude
        \nimplique de grandes redevabilit\xE9s.\n\n101\n00:05:04,470 --> 00:05:06,038\nC'est
        m\xEAme pas \n\xE7a le proverbe.\n\n102\n00:05:06,071 --> 00:05:08,574\nJ'aime
        bien ses c\xE9r\xE9ales, par contre.\nJe lui accorde \xE7a.\n\n103\n00:05:08,607
        --> 00:05:10,843\nOh, mon dieu.\nLes flics grillent pas les feux rouges ?\n\n104\n00:05:10,875
        --> 00:05:12,677\nOh, ouais, certains.\nMais pas ton p\xE8re.\n\n105\n00:05:14,012
        --> 00:05:16,682\n...\n\n106\n00:05:16,714 --> 00:05:18,917\n...\n\n107\n00:05:18,951
        --> 00:05:24,623\n...\n\n108\n00:05:24,656 --> 00:05:26,692\nPourquoi je peux
        pas revenir\n\xE0 Brooklyn Middle?\n\n109\n00:05:26,725 --> 00:05:28,094\nT'as
        commenc\xE9 y a \xE0 peine deux semaines.\n\n110\n00:05:28,127 --> 00:05:29,862\nTu
        m'emm\xE8neras pas sur ce terrain.\n\n111\n00:05:29,894 --> 00:05:32,063\nJe
        trouve juste que cette\nnouvelle \xE9cole est \xE9litiste.\n\n112\n00:05:32,096
        --> 00:05:33,665\n- \"\xC9litiste\"?\n- Et je pr\xE9f\xE8rerai aller\n\n113\n00:05:33,699
        --> 00:05:35,468\ndans une \xE9cole normale\navec des gens comme moi.\n\n114\n00:05:35,500
        --> 00:05:37,402\n\"Des gens comme toi\"?\nCe sont des gens comme toi!\n\n115\n00:05:37,435
        --> 00:05:39,838\nSi je suis l\xE0 c'est juste parce\nque j'ai gagn\xE9 cette
        stupide loterie.\n\n116\n00:05:39,872 --> 00:05:42,574\nC'est pas vrai. T'as
        pass\xE9 le test\nd'admission comme tout le monde.\n\n117\n00:05:42,608 -->
        00:05:45,144\nT'as une opportunit\xE9 en or ici.\nTu veux la g\xE2cher?\n\n118\n00:05:45,177
        --> 00:05:46,846\nT'as envie de finir\ncomme ton oncle?\n\n119\n00:05:46,879
        --> 00:05:49,915\nC'est quoi le souci avec oncle Aaron?\nC'est un mec bien.\n\n120\n00:05:49,947
        --> 00:05:51,483\nOn fait tous des choix dans la vie.\n\n121\n00:05:51,516
        --> 00:05:53,025\nJ'ai pas trop \nl'impression d'avoir le choix l\xE0.\n\n122\n00:05:53,050
        --> 00:05:54,486\nNon tu l'as pas!\n\n123\n00:06:07,699 --> 00:06:09,033\nJe
        t'aime, Miles.\n\n124\n00:06:09,067 --> 00:06:11,971\nOuais, je sais papa.\n\xC0
        vendredi.\n\n125\n00:06:15,774 --> 00:06:17,226\nTu dois dire \"Je t'aime\"
        aussi.\n\n126\n00:06:17,227 --> 00:06:18,677\nPapa, t'es s\xE9rieux?\n\n127\n00:06:18,709
        --> 00:06:19,820\nJe veux l'entendre.\n\"Je t'aime, papa.\"\n\n128\n00:06:19,845
        --> 00:06:21,480\nTu veux m'entendre le dire?\n\n129\n00:06:21,512 --> 00:06:22,855\nTu
        me d\xE9poses\n\xE0 l'\xE9cole.\n\n130\n00:06:22,880 --> 00:06:24,056\n- \"Je
        t'aime, papa.\"\n- Mais regarde o\xF9 on est!\n\n131\n00:06:24,081 --> 00:06:25,050\n\"Papa,
        je t'aime.\"\n\n132\n00:06:27,052 --> 00:06:29,789\nPapa, je t'aime.\n\n133\n00:06:29,822
        --> 00:06:31,456\nBien re\xE7u.\n\n134\n00:06:31,490 --> 00:06:33,559\nEt
        fais-moi tes lacets, s'il te pla\xEEt.\n\n135\n00:06:35,194 --> 00:06:37,730\n\"Je
        t'aime, papa.\"\n\n136\n00:06:38,997 --> 00:06:41,667\nHey, salut!\n\xC7a
        roule?\n\n137\n00:06:41,699 --> 00:06:42,917\nCourt week-end, hein?\n\n138\n00:06:42,918
        --> 00:06:44,135\n\"Bien re\xE7u.\"\n\n139\n00:06:44,168 --> 00:06:46,504\nOh,
        mon dieu!\nC'est trop g\xEAnant.\n\n140\n00:06:46,538 --> 00:06:48,206\nOn
        porte la m\xEAme veste!\n\n141\n00:06:48,240 --> 00:06:50,509\nHey. Ton lacet
        est d\xE9fait.\n\n142\n00:06:50,541 --> 00:06:53,545\nOuais, je sais.\nC'est
        un style.\n\n143\n00:06:53,579 --> 00:06:55,548\n...\n\n144\n00:06:55,581
        --> 00:06:56,682\n...\n\n145\n00:06:56,714 --> 00:06:59,117\n...\n\n146\n00:06:59,151
        --> 00:07:00,586\nQui peut r\xE9soudre l'\xE9quation pour XY?\n\n147\n00:07:02,521
        --> 00:07:04,790\nEt c'est ce qu'on appelle\nun syllogisme.\n\n148\n00:07:04,822
        --> 00:07:07,225\n<i>Vous lirez deux chapitres\ndes Grandes Esp\xE9rances.</i>\n\n149\n00:07:07,259
        --> 00:07:09,795\nUn QCM \xE0 faire chez vous\nsur la pression volum\xE9trique.\n\n150\n00:07:09,827
        --> 00:07:12,130\nUne r\xE9daction de cinq pages o\xF9\nvous \xE9taierez votre
        conclusion.\n\n151\n00:07:20,004 --> 00:07:22,740\n<i>...un nombre incalculable\nd'autres
        possibilit\xE9s.</i>\n\n152\n00:07:22,774 --> 00:07:25,076\n<i>Il pourrait
        exister un\nunivers o\xF9 je porte du rouge.</i>\n\n153\n00:07:25,110 -->
        00:07:27,680\n<i>Ou un pantalon en cuir.</i>\n\n154\n00:07:27,713 --> 00:07:31,016\nMonsieur
        Morales. Qui bouge dans le noir.\nVous \xEAtes encore en retard.\n\n155\n00:07:31,048
        --> 00:07:33,585\nEinstein a dit que le\ntemps \xE9tait relatif, pas vrai?\n\n156\n00:07:33,619
        --> 00:07:37,790\nPeut-\xEAtre que je suis pas en retard.\nPeut-\xEAtre que
        c'est vous qui \xEAtes en avance.\n\n157\n00:07:41,059 --> 00:07:43,762\nD\xE9sol\xE9.\nC'\xE9tait
        si silencieux.\n\n158\n00:07:43,795 --> 00:07:46,064\nTu veux rester plant\xE9\nl\xE0,\n\n159\n00:07:46,098
        --> 00:07:48,133\nou bien tu veux t'asseoir?\n\n160\n00:07:48,165 --> 00:07:53,038\n<i>Notre
        univers n'est, en fait, qu'un seul \nparmi de nombreux autres univers parall\xE8les</i>\n\n161\n00:07:53,071
        --> 00:07:55,107\n<i>tous existant\nen m\xEAme temps.</i>\n\n162\n00:07:55,139
        --> 00:07:57,909\n<i>Gr\xE2ce \xE0 notre travail ici, \xE0\nla Fisk Family
        Foundation...</i>\n\n163\n00:07:57,942 --> 00:07:59,027\nJ'ai bien aim\xE9
        ta blague.\n\n164\n00:07:59,028 --> 00:08:00,111\nVraiment?\n\n165\n00:08:00,144
